<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>B&amp;H QR Maker</title>
<style>
  :root {
    --bg: #141414; --panel: #1f1f1f; --line: #333; --text: #f2f2f2;
    --muted: #9a9a9a; --accent: #ffffff; --error: #ff7a6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  }
  main { max-width: 560px; margin: 0 auto; padding: 40px 16px 64px; }
  h1 { font-size: 28px; letter-spacing: -0.02em; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 28px; }
  label { display: block; font-size: 13px; font-weight: 600; text-transform: uppercase;
          letter-spacing: 0.06em; color: var(--muted); margin: 0 0 6px; }
  input[type=text], input[type=url] {
    width: 100%; padding: 14px; font-size: 16px; color: var(--text);
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px; outline: none;
  }
  input:focus { border-color: #777; }
  .field { margin-bottom: 18px; }
  .preview {
    margin: 26px 0 18px; aspect-ratio: 1; border-radius: 14px; border: 1px solid var(--line);
    background-color: #2a2a2a;
    background-image: linear-gradient(45deg, #242424 25%, transparent 25%, transparent 75%, #242424 75%),
                      linear-gradient(45deg, #242424 25%, transparent 25%, transparent 75%, #242424 75%);
    background-size: 24px 24px; background-position: 0 0, 12px 12px;
    display: grid; place-items: center; overflow: hidden;
  }
  .preview canvas { width: 100%; height: 100%; display: block; }
  .empty { color: var(--muted); font-size: 14px; padding: 24px; text-align: center; }
  .buttons { display: flex; gap: 10px; flex-wrap: wrap; }
  button {
    flex: 1 1 160px; padding: 14px; font-size: 16px; font-weight: 600; border-radius: 10px;
    border: 1px solid var(--accent); background: var(--accent); color: #111; cursor: pointer;
  }
  button.secondary { background: transparent; color: var(--text); border-color: #555; }
  button.wide { flex-basis: 100%; }
  button span { display: block; font-size: 12px; font-weight: 400; color: var(--muted); }
  button:disabled { opacity: 0.35; cursor: default; }
  .error { color: var(--error); font-size: 14px; min-height: 1.5em; margin-top: 6px; }
</style>
</head>
<body>
<main>
  <h1>B&amp;H QR Maker</h1>
  <p class="sub">Paste a link to get a white-on-transparent QR code with the B&amp;H logo.</p>

  <div class="field">
    <label for="url">Link</label>
    <input id="url" type="url" inputmode="url" autocomplete="off" placeholder="https://www.bhphotovideo.com/…">
    <div class="error" id="error"></div>
  </div>
  <div class="field">
    <label for="name">File name</label>
    <input id="name" type="text" autocomplete="off" placeholder="BH_QR">
  </div>

  <div class="preview" id="preview"><div class="empty">Your QR code will show up here.</div></div>

  <div class="buttons">
    <button id="png" disabled>Download PNG</button>
    <button id="svg" class="secondary" disabled>Download SVG</button>
    <button id="plain" class="secondary wide" disabled>Download black &amp; white PNG <span>black on white, for light backgrounds</span></button>
  </div>
</main>

<script>
// Minimal QR Code encoder: byte mode (UTF-8), error correction level H.
// Based on the ISO/IEC 18004 spec. Returns a square array of booleans (true = dark module).
(function (root) {
  // Level H block structure per version:
  // [EC codewords per block, group-1 blocks, group-1 data codewords, group-2 blocks, group-2 data codewords]
  const H = [null,
    [17,1,9],[28,1,16],[22,2,13],[16,4,9],[22,2,11,2,12],[28,4,15],[26,4,13,1,14],[26,4,14,2,15],
    [24,4,12,4,13],[28,6,15,2,16],[24,3,12,8,13],[28,7,14,4,15],[22,12,11,4,12],[24,11,12,5,13],
    [24,11,12,7,13],[30,3,15,13,16],[28,2,14,17,15],[28,2,14,19,15],[26,9,13,16,14],[28,15,15,10,16],
    [30,19,16,6,17],[24,34,13],[30,16,15,14,16],[30,30,16,2,17],[30,22,15,13,16],[30,33,16,4,17],
    [30,12,15,28,16],[30,11,15,31,16],[30,19,15,26,16],[30,23,15,25,16],[30,23,15,28,16],
    [30,19,15,35,16],[30,11,15,46,16],[30,59,16,1,17],[30,22,15,41,16],[30,2,15,64,16],
    [30,24,15,46,16],[30,42,15,32,16],[30,10,15,67,16],[30,20,15,61,16]];

  // Galois field GF(256) math for Reed-Solomon error correction
  const EXP = new Array(512), LOG = new Array(256);
  for (let i = 0, x = 1; i < 255; i++) { EXP[i] = x; LOG[x] = i; x <<= 1; if (x & 256) x ^= 0x11D; }
  for (let i = 255; i < 512; i++) EXP[i] = EXP[i - 255];
  const mul = (a, b) => (a && b) ? EXP[LOG[a] + LOG[b]] : 0;

  function rsGenerator(deg) {
    let g = [1];
    for (let i = 0; i < deg; i++) {
      const next = new Array(g.length + 1).fill(0);
      for (let j = 0; j < g.length; j++) { next[j] ^= g[j]; next[j + 1] ^= mul(g[j], EXP[i]); }
      g = next;
    }
    return g;
  }
  function rsRemainder(data, deg) {
    const gen = rsGenerator(deg), r = new Array(deg).fill(0);
    for (const b of data) {
      const f = b ^ r[0]; r.shift(); r.push(0);
      for (let i = 0; i < deg; i++) r[i] ^= mul(gen[i + 1], f);
    }
    return r;
  }

  const rawModules = v => {
    let r = (16 * v + 128) * v + 64;
    if (v >= 2) { const n = Math.floor(v / 7) + 2; r -= (25 * n - 10) * n - 55; if (v >= 7) r -= 36; }
    return r;
  };
  const dataCapacity = v => { const t = H[v]; return t[1] * t[2] + (t[3] || 0) * (t[4] || 0); };
  // Self-check of the table against the spec's total codeword count
  for (let v = 1; v <= 40; v++) {
    const t = H[v], total = t[1] * (t[2] + t[0]) + (t[3] || 0) * ((t[4] || 0) + t[0]);
    if (total !== Math.floor(rawModules(v) / 8)) throw new Error("QR table error at version " + v);
  }

  function alignmentPositions(v) {
    if (v === 1) return [];
    const n = Math.floor(v / 7) + 2, size = v * 4 + 17;
    const step = v === 32 ? 26 : Math.ceil((v * 4 + 4) / (n * 2 - 2)) * 2;
    const res = [6];
    for (let p = size - 7; res.length < n; p -= step) res.splice(1, 0, p);
    return res;
  }

  function encode(text) {
    const bytes = Array.from(new TextEncoder().encode(text));
    let v = 1;
    for (; v <= 40; v++) {
      const bits = 4 + (v < 10 ? 8 : 16) + bytes.length * 8;
      if (bits <= dataCapacity(v) * 8) break;
    }
    if (v > 40) throw new Error("That link is too long for a QR code.");

    // Build the data bit stream
    const bb = [], push = (val, len) => { for (let i = len - 1; i >= 0; i--) bb.push((val >>> i) & 1); };
    push(4, 4); push(bytes.length, v < 10 ? 8 : 16); bytes.forEach(b => push(b, 8));
    const cap = dataCapacity(v) * 8;
    push(0, Math.min(4, cap - bb.length));
    while (bb.length % 8) bb.push(0);
    for (let pad = 0xEC; bb.length < cap; pad ^= 0xEC ^ 0x11) push(pad, 8);
    const data = [];
    for (let i = 0; i < bb.length; i += 8) data.push(parseInt(bb.slice(i, i + 8).join(""), 2));

    // Split into blocks, add error correction, interleave
    const t = H[v], blocks = [];
    let k = 0;
    for (let g = 0; g < 2; g++) {
      const count = t[1 + g * 2] || 0, len = t[2 + g * 2] || 0;
      for (let i = 0; i < count; i++) { const d = data.slice(k, k + len); k += len; blocks.push({ d, e: rsRemainder(d, t[0]) }); }
    }
    const out = [], maxD = Math.max(...blocks.map(b => b.d.length));
    for (let i = 0; i < maxD; i++) blocks.forEach(b => { if (i < b.d.length) out.push(b.d[i]); });
    for (let i = 0; i < t[0]; i++) blocks.forEach(b => out.push(b.e[i]));

    // Draw function patterns
    const size = v * 4 + 17;
    const m = Array.from({ length: size }, () => new Array(size).fill(false));
    const fn = Array.from({ length: size }, () => new Array(size).fill(false));
    const set = (x, y, dark) => { m[y][x] = dark; fn[y][x] = true; };
    for (let i = 0; i < size; i++) { set(6, i, i % 2 === 0); set(i, 6, i % 2 === 0); }
    const finder = (cx, cy) => {
      for (let dy = -4; dy <= 4; dy++) for (let dx = -4; dx <= 4; dx++) {
        const x = cx + dx, y = cy + dy, d = Math.max(Math.abs(dx), Math.abs(dy));
        if (x >= 0 && x < size && y >= 0 && y < size) set(x, y, d !== 2 && d !== 4);
      }
    };
    finder(3, 3); finder(size - 4, 3); finder(3, size - 4);
    const ap = alignmentPositions(v), na = ap.length;
    for (let i = 0; i < na; i++) for (let j = 0; j < na; j++) {
      if ((i === 0 && j === 0) || (i === 0 && j === na - 1) || (i === na - 1 && j === 0)) continue;
      for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++)
        set(ap[i] + dx, ap[j] + dy, Math.max(Math.abs(dx), Math.abs(dy)) !== 1);
    }
    const drawFormat = mask => {
      const d = (2 << 3) | mask; // level H format bits = 2
      let r = d; for (let i = 0; i < 10; i++) r = (r << 1) ^ ((r >>> 9) * 0x537);
      const bits = ((d << 10) | r) ^ 0x5412, bit = i => ((bits >>> i) & 1) === 1;
      for (let i = 0; i <= 5; i++) set(8, i, bit(i));
      set(8, 7, bit(6)); set(8, 8, bit(7)); set(7, 8, bit(8));
      for (let i = 9; i < 15; i++) set(14 - i, 8, bit(i));
      for (let i = 0; i < 8; i++) set(size - 1 - i, 8, bit(i));
      for (let i = 8; i < 15; i++) set(8, size - 15 + i, bit(i));
      set(8, size - 8, true);
    };
    drawFormat(0);
    if (v >= 7) {
      let r = v; for (let i = 0; i < 12; i++) r = (r << 1) ^ ((r >>> 11) * 0x1F25);
      const bits = (v << 12) | r;
      for (let i = 0; i < 18; i++) {
        const bit = ((bits >>> i) & 1) === 1, a = size - 11 + (i % 3), b = Math.floor(i / 3);
        set(a, b, bit); set(b, a, bit);
      }
    }

    // Place data bits in the zigzag pattern
    let i = 0;
    for (let right = size - 1; right >= 1; right -= 2) {
      if (right === 6) right = 5;
      for (let vert = 0; vert < size; vert++) for (let j = 0; j < 2; j++) {
        const x = right - j, up = ((right + 1) & 2) === 0, y = up ? size - 1 - vert : vert;
        if (!fn[y][x] && i < out.length * 8) { m[y][x] = ((out[i >>> 3] >>> (7 - (i & 7))) & 1) === 1; i++; }
      }
    }

    // Try all 8 masks and keep the one with the lowest penalty score
    const maskFn = [
      (x, y) => (x + y) % 2 === 0, (x, y) => y % 2 === 0, (x) => x % 3 === 0, (x, y) => (x + y) % 3 === 0,
      (x, y) => (Math.floor(x / 3) + Math.floor(y / 2)) % 2 === 0, (x, y) => x * y % 2 + x * y % 3 === 0,
      (x, y) => (x * y % 2 + x * y % 3) % 2 === 0, (x, y) => ((x + y) % 2 + x * y % 3) % 2 === 0];
    const applyMask = k => {
      for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) if (!fn[y][x] && maskFn[k](x, y)) m[y][x] = !m[y][x];
    };
    const penalty = () => {
      let p = 0;
      const line = get => {
        for (let a = 0; a < size; a++) {
          let run = 1;
          for (let b = 1; b <= size; b++) {
            if (b < size && get(a, b) === get(a, b - 1)) run++;
            else { if (run >= 5) p += run - 2; run = 1; }
          }
          for (let b = 0; b + 10 < size; b++) {
            const s = Array.from({ length: 11 }, (_, q) => get(a, b + q) ? 1 : 0).join("");
            if (s === "10111010000" || s === "00001011101") p += 40;
          }
        }
      };
      line((a, b) => m[a][b]); line((a, b) => m[b][a]);
      let dark = 0;
      for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
        if (m[y][x]) dark++;
        if (x < size - 1 && y < size - 1 && m[y][x] === m[y][x + 1] && m[y][x] === m[y + 1][x] && m[y][x] === m[y + 1][x + 1]) p += 3;
      }
      p += Math.floor(Math.abs(dark * 20 - size * size * 10) / (size * size)) * 10;
      return p;
    };
    let best = 0, bestScore = Infinity;
    for (let k = 0; k < 8; k++) {
      applyMask(k); drawFormat(k);
      const s = penalty();
      if (s < bestScore) { bestScore = s; best = k; }
      applyMask(k);
    }
    applyMask(best); drawFormat(best);
    return m;
  }

  root.QR = { encode };
  if (typeof module !== "undefined") module.exports = { encode };
})(typeof window !== "undefined" ? window : globalThis);

</script>

const logo = new Image();
logo.src = LOGO_SRC;

const $ = id => document.getElementById(id);
let current = null; // { matrix, url }

// Work out where everything goes, in module units
function layout(n) {
  const q = STYLE.quietZone, total = n + q * 2, c = total / 2;
  const lw = n * STYLE.logoWidth, lh = lw * logo.naturalHeight / logo.naturalWidth;
  const p = STYLE.padding;
  return { total, logo: { x: c - lw / 2, y: c - lh / 2, w: lw, h: lh },
           box: { x: c - lw / 2 - p, y: c - lh / 2 - p, w: lw + p * 2, h: lh + p * 2 } };
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

function draw(canvas, matrix, px) {
  const n = matrix.length, L = layout(n), M = Math.floor(px / L.total), q = STYLE.quietZone;
  canvas.width = canvas.height = M * L.total;
  const ctx = canvas.getContext("2d");
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = "#fff";
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++)
    if (matrix[y][x]) ctx.fillRect((x + q) * M, (y + q) * M, M, M);
  const b = L.box, s = STYLE.stroke * M, r = STYLE.radius * M;
  roundRect(ctx, b.x * M - s, b.y * M - s, b.w * M + s * 2, b.h * M + s * 2, r + s); ctx.fill(); // outline
  ctx.globalCompositeOperation = "destination-out";
  roundRect(ctx, b.x * M, b.y * M, b.w * M, b.h * M, r); ctx.fill(); // knockout
  ctx.globalCompositeOperation = "source-over";
  ctx.drawImage(logo, L.logo.x * M, L.logo.y * M, L.logo.w * M, L.logo.h * M);
}

// Black & white version: black modules on solid white, with the logo
function drawPlain(canvas, matrix, px) {
  const n = matrix.length, q = STYLE.quietZone, total = n + q * 2, M = Math.floor(px / total);
  canvas.width = canvas.height = M * total;
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = "#000";
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++)
    if (matrix[y][x]) ctx.fillRect((x + q) * M, (y + q) * M, M, M);
  // Same logo knockout as the styled version, reversed: black outline, white inside, black logo
  const L = layout(n), bx = L.box, s = STYLE.stroke * M, r = STYLE.radius * M;
  roundRect(ctx, bx.x * M - s, bx.y * M - s, bx.w * M + s * 2, bx.h * M + s * 2, r + s); ctx.fill();
  ctx.fillStyle = "#fff"; roundRect(ctx, bx.x * M, bx.y * M, bx.w * M, bx.h * M, r); ctx.fill();
  ctx.drawImage(blackLogo(), L.logo.x * M, L.logo.y * M, L.logo.w * M, L.logo.h * M);
}

// Recolor the white logo to black
function blackLogo() {
  const c = document.createElement("canvas");
  c.width = logo.naturalWidth; c.height = logo.naturalHeight;
  const x = c.getContext("2d");
  x.drawImage(logo, 0, 0);
  x.globalCompositeOperation = "source-in"; x.fillStyle = "#000"; x.fillRect(0, 0, c.width, c.height);
  return c;
}

function buildSVG(matrix) {
  const n = matrix.length, L = layout(n), q = STYLE.quietZone, b = L.box, s = STYLE.stroke, r = STYLE.radius;
  let d = "";
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++)
    if (matrix[y][x]) d += `M${x + q} ${y + q}h1v1h-1z`;
  const f = v => +v.toFixed(4);
  return `<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 ${L.total} ${L.total}" width="${L.total * 10}" height="${L.total * 10}" shape-rendering="crispEdges">
<defs><mask id="ko"><rect width="${L.total}" height="${L.total}" fill="#fff"/><rect x="${f(b.x)}" y="${f(b.y)}" width="${f(b.w)}" height="${f(b.h)}" rx="${r}" fill="#000"/></mask></defs>
<g mask="url(#ko)" fill="#fff"><path d="${d}"/><rect x="${f(b.x - s)}" y="${f(b.y - s)}" width="${f(b.w + s * 2)}" height="${f(b.h + s * 2)}" rx="${f(r + s)}"/></g>
<image x="${f(L.logo.x)}" y="${f(L.logo.y)}" width="${f(L.logo.w)}" height="${f(L.logo.h)}" xlink:href="${LOGO_SRC}"/>
</svg>`;
}

// Suggest a file name from the link (event links get their ID)
function suggestName(url) {
  const id = url.match(/\/id\/(\d+)/);
  return id ? `BH_Event_${id[1]}_QR` : "BH_QR";
}
let nameTouched = false;
$("name").addEventListener("input", () => { nameTouched = $("name").value.trim() !== ""; });

function update() {
  const url = $("url").value.trim();
  $("error").textContent = "";
  if (!url) { current = null; $("preview").innerHTML = '<div class="empty">Your QR code will show up here.</div>'; setButtons(false); return; }
  if (!/^https?:\/\/\S+\.\S+/i.test(url)) $("error").textContent = "Double-check the link. It should start with https://";
  try {
    const matrix = QR.encode(url);
    current = { matrix, url };
    if (!nameTouched) $("name").value = suggestName(url);
    const c = document.createElement("canvas");
    draw(c, matrix, 1200);
    $("preview").replaceChildren(c);
    setButtons(true);
  } catch (e) { current = null; $("error").textContent = e.message; setButtons(false); }
}
function setButtons(on) { $("png").disabled = $("svg").disabled = $("plain").disabled = !on; }
function fileName(ext) { return ($("name").value.trim() || "BH_QR").replace(/[^\w.-]+/g, "_") + ext; }

function save(blob, name) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

$("png").addEventListener("click", () => {
  if (!current) return;
  const c = document.createElement("canvas");
  draw(c, current.matrix, STYLE.targetPx);
  c.toBlob(b => save(b, fileName(".png")), "image/png");
});
$("plain").addEventListener("click", () => {
  if (!current) return;
  const c = document.createElement("canvas");
  drawPlain(c, current.matrix, STYLE.targetPx);
  c.toBlob(b => save(b, fileName("_BW.png")), "image/png");
});
$("svg").addEventListener("click", () => {
  if (current) save(new Blob([buildSVG(current.matrix)], { type: "image/svg+xml" }), fileName(".svg"));
});

$("url").addEventListener("input", update);
logo.onload = update;
</script>
